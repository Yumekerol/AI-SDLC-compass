
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SCANNER_URL: http://scanner:8001
      AGENTS_URL: http://agents:8002
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      scanner:
        condition: service_healthy
      agents:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8002
      # Ollama runs on the host, not in a container — host.docker.internal
      # resolves there on Docker Desktop (Mac/Windows); extra_hosts below
      # makes it resolve on native Linux too.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      LOG_LEVEL: info
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: application-network
